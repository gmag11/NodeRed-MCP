name: NPM Publish

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          # Trusted publishing requires npm >= 11.5.1. Node 22 bundles npm 10.x,
          # which has no OIDC support at all: it silently falls back to token
          # auth and the publish fails with a 404 on an unauthenticated PUT.
          npm install --global npm@^11.5.1
          echo "Using npm $(npm --version) on Node $(node --version)"

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        env:
          RAW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          # A leading 'v' prefix is optional on the tag; package.json#version
          # must always be the bare semver with no prefix.
          TAG_VERSION="${RAW_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: git tag is ${RAW_TAG} (expected version ${TAG_VERSION}) but package.json version is ${PKG_VERSION}"
            echo "::error::Ensure package.json#version equals the tag with any leading 'v' removed, before pushing."
            exit 1
          fi
          echo "Version check passed: ${RAW_TAG} (${TAG_VERSION}) == ${PKG_VERSION}"

      - name: Publish to npm
        run: npm publish --access public --provenance
